<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Registration | Texas IORG</title>
  <meta name="description" content="Register and pay for Texas IORG (Rainbow Girls) events.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="rainbow" aria-hidden="true"></div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-name">Texas IORG</span>
        <span class="brand-sub">Event Registration</span>
      </a>
      <nav><a id="main-site-link" href="https://www.txiorg.org/">Main site</a></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="intro panel">
      <h1>Upcoming events</h1>
      <p>Pick an event to register. You can sign up several girls and adults at once, then pay online by card or PayPal.</p>
    </section>

    <div id="demo-banner"></div>
    <section id="event-list" class="event-list" aria-live="polite">
      <p class="muted">Loading events…</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap" id="footer"></div>
  </footer>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
  <script>TXIORG.renderEventList();</script>
</body>
</html>
